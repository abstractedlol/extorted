<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>extorted</title>
    <style>
        :root {
            --tg-bg: #0e1621;
            --tg-sidebar: #17212b;
            --tg-active: #232e3c;
            --tg-border: #0e1621;
            --tg-accent: #5288c1;
            --tg-green: #4fae4e;
            --tg-bubble-out: #2b5278;
            --tg-bubble-in: #182533;
            --tg-text: #f5f5f5;
            --tg-muted: #7f91a4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { background: var(--tg-bg); color: var(--tg-text); height: 100vh; overflow: hidden; display: flex; }

        /* Auth Screen */
        #auth-modal { position: fixed; inset: 0; background: rgba(14, 22, 33, 0.98); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-card { background: var(--tg-sidebar); border: 1px solid #243447; border-radius: 12px; width: 340px; padding: 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-card h2 { color: var(--tg-accent); font-size: 20px; font-weight: 700; text-align: center; }
        .auth-card input { background: var(--tg-bg); border: 1px solid #243447; border-radius: 8px; color: #fff; padding: 12px; font-size: 14px; outline: none; }
        .auth-card input:focus { border-color: var(--tg-accent); }
        .auth-btns { display: flex; gap: 8px; }
        .auth-btns button { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-blue { background: var(--tg-accent); color: #fff; }
        .btn-gray { background: #243447; color: #fff; }
        #auth-msg { font-size: 12px; color: #ff5e5e; text-align: center; min-height: 14px; }

        /* Main Workspace */
        #app { display: none; width: 100vw; height: 100vh; flex-direction: row; }

        /* Left Sidebar */
        #sidebar { width: 320px; background: var(--tg-sidebar); border-right: 1px solid var(--tg-border); display: flex; flex-direction: column; }
        .side-top { padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
        .side-top input { flex: 1; background: var(--tg-bg); border: 1px solid #243447; border-radius: 18px; color: #fff; padding: 8px 14px; font-size: 13px; outline: none; }
        .side-top button { width: 32px; height: 32px; border-radius: 50%; background: var(--tg-accent); border: none; color: #fff; font-size: 16px; cursor: pointer; }
        
        #chats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: 0.15s; border-radius: 0; }
        .chat-item:hover { background: #1c2733; }
        .chat-item.active { background: var(--tg-active); }
        
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #3e546a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; position: relative; flex-shrink: 0; }
        .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--tg-sidebar); position: absolute; bottom: 0; right: 0; }
        .dot.online { background: var(--tg-green); }
        .dot.offline { background: #667280; }
        
        .chat-meta { flex: 1; min-width: 0; }
        .chat-meta h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-meta p { font-size: 12px; color: var(--tg-muted); margin-top: 2px; }

        /* Main Chat Window */
        #chat-window { flex: 1; display: flex; flex-direction: column; background: var(--tg-bg); position: relative; }
        
        /* Telegram Header with Call/SS buttons */
        .chat-header { height: 56px; background: var(--tg-sidebar); border-bottom: 1px solid var(--tg-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .user-details { display: flex; align-items: center; gap: 12px; }
        .user-details h3 { font-size: 15px; font-weight: 600; }
        .user-details span { font-size: 12px; color: var(--tg-muted); display: block; }
        
        .header-actions { display: flex; gap: 10px; }
        .header-btn { background: #202b36; border: 1px solid #2e3c4a; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.15s; }
        .header-btn:hover { background: #273543; border-color: var(--tg-accent); color: var(--tg-accent); }
        .header-btn.live { background: rgba(79, 174, 78, 0.2) !important; border-color: var(--tg-green) !important; color: var(--tg-green) !important; }

        /* Video Stage for Screen Sharing */
        #screen-stage { height: 280px; background: #000; border-bottom: 1px solid var(--tg-border); display: none; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* Chat Message Stream */
        #messages-stream { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.out { justify-content: flex-end; }
        .msg-row.in { justify-content: flex-start; }
        
        .bubble { max-width: 60%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
        .out .bubble { background: var(--tg-bubble-out); border-bottom-right-radius: 3px; color: #fff; }
        .in .bubble { background: var(--tg-bubble-in); border-bottom-left-radius: 3px; color: #fff; }
        .bubble .sender-title { font-size: 11px; font-weight: 700; color: var(--tg-accent); margin-bottom: 2px; }
        .bubble-meta { font-size: 10px; color: rgba(255, 255, 255, 0.6); text-align: right; margin-top: 3px; display: flex; justify-content: flex-end; gap: 4px; }

        /* Input Field Bar */
        .chat-input-bar { background: var(--tg-sidebar); padding: 12px 18px; border-top: 1px solid var(--tg-border); display: flex; gap: 10px; align-items: center; }
        .chat-input-bar input { flex: 1; background: var(--tg-bg); border: 1px solid #243447; border-radius: 8px; color: #fff; padding: 10px 14px; font-size: 14px; outline: none; }
        .chat-input-bar input:focus { border-color: var(--tg-accent); }
        .chat-input-bar button { background: var(--tg-accent); border: none; width: 38px; height: 38px; border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- Auth -->
    <div id="auth-modal">
        <div class="auth-card">
            <h2>extorted</h2>
            <input id="auth-user" placeholder="Username" autocomplete="off">
            <input id="auth-pass" type="password" placeholder="Password">
            <div class="auth-btns">
                <button class="btn-blue" onclick="auth('login')">Log In</button>
                <button class="btn-gray" onclick="auth('register')">Register</button>
            </div>
            <div id="auth-msg"></div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="app">
        <!-- Sidebar -->
        <div id="sidebar">
            <div class="side-top">
                <input id="add-friend-input" placeholder="Add username...">
                <button onclick="addFriend()">+</button>
            </div>
            <div id="chats-list">
                <div class="chat-item active" onclick="selectChat('global')">
                    <div class="avatar">#</div>
                    <div class="chat-meta">
                        <h4>Global Lobby</h4>
                        <p>Public room</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chat-window">
            <div class="chat-header">
                <div class="user-details">
                    <div class="avatar" id="header-avatar" style="width: 36px; height: 36px; font-size: 14px;">#</div>
                    <div>
                        <h3 id="chat-title">Global Lobby</h3>
                        <span id="chat-subtitle">Public group</span>
                    </div>
                </div>

                <!-- Call and Screen Share Buttons in Chat Bar -->
                <div class="header-actions">
                    <button id="call-btn" class="header-btn" onclick="toggleCall()">📞 Call</button>
                    <button id="screen-btn" class="header-btn" onclick="toggleScreen()">🖥️ Share (720p 30+)</button>
                </div>
            </div>

            <!-- Screen Share Stage -->
            <div id="screen-stage">
                <video id="screen-display" autoplay playsinline></video>
            </div>

            <!-- Messages Stream -->
            <div id="messages-stream"></div>

            <!-- Input Bar -->
            <div class="chat-input-bar">
                <input id="chat-input" placeholder="Write a message..." onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()">➤</button>
            </div>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = null;
        let currentTarget = 'global';
        let peer = null;
        let localMicStream = null;
        let localScreenStream = null;

        const iceConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        function auth(mode) {
            const user = document.getElementById('auth-user').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if (!user || !pass) return showAuthErr('Please fill in both fields.');
            socket.emit(`auth-${mode}`, { username: user, password: pass });
        }

        function showAuthErr(msg) {
            document.getElementById('auth-msg').innerText = msg;
        }

        socket.on('auth-result', res => showAuthErr(res.msg));

        socket.on('login-success', (data) => {
            myUsername = data.username;
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            data.friends.forEach(renderFriend);
        });

        function addFriend() {
            const input = document.getElementById('add-friend-input');
            if (input.value.trim()) {
                socket.emit('add-friend', input.value.trim());
                input.value = '';
            }
        }

        socket.on('friend-error', err => alert(err));
        socket.on('friend-added', renderFriend);

        socket.on('friend-status', ({ username, online }) => {
            const dot = document.getElementById(`dot-${username}`);
            if (dot) dot.className = `dot ${online ? 'online' : 'offline'}`;
            if (currentTarget === username) {
                document.getElementById('chat-subtitle').innerText = online ? 'Online' : 'Offline';
            }
        });

        function renderFriend(friend) {
            if (document.getElementById(`friend-${friend.username}`)) return;
            const list = document.getElementById('chats-list');
            const item = document.createElement('div');
            item.className = 'chat-item';
            item.id = `friend-${friend.username}`;
            item.onclick = () => selectChat(friend.username, friend.online);
            item.innerHTML = `
                <div class="avatar">
                    ${friend.username[0].toUpperCase()}
                    <div id="dot-${friend.username}" class="dot ${friend.online ? 'online' : 'offline'}"></div>
                </div>
                <div class="chat-meta">
                    <h4>${friend.username}</h4>
                    <p>${friend.online ? 'Online' : 'Offline'}</p>
                </div>
            `;
            list.appendChild(item);
        }

        function selectChat(target, isOnline = true) {
            currentTarget = target;
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            const targetEl = target === 'global' ? document.querySelector('.chat-item') : document.getElementById(`friend-${target}`);
            if (targetEl) targetEl.classList.add('active');

            if (target === 'global') {
                document.getElementById('header-avatar').innerText = '#';
                document.getElementById('chat-title').innerText = 'Global Lobby';
                document.getElementById('chat-subtitle').innerText = 'Public group';
            } else {
                document.getElementById('header-avatar').innerText = target[0].toUpperCase();
                document.getElementById('chat-title').innerText = target;
                document.getElementById('chat-subtitle').innerText = isOnline ? 'Online' : 'Offline';
            }
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            socket.emit('send-chat', { text: input.value });
            input.value = '';
        }

        socket.on('chat-message', (data) => {
            const container = document.getElementById('messages-stream');
            const row = document.createElement('div');
            const isMe = data.sender === myUsername;
            row.className = `msg-row ${isMe ? 'out' : 'in'}`;

            row.innerHTML = `
                <div class="bubble">
                    ${!isMe ? `<div class="sender-title">${data.sender}</div>` : ''}
                    <div>${data.text}</div>
                    <div class="bubble-meta">
                        ${data.time} ${isMe ? '✓✓' : ''}
                    </div>
                </div>
            `;
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        });

        function getPeer(target) {
            if (peer) return peer;
            peer = new RTCPeerConnection(iceConfig);

            peer.ontrack = (e) => {
                if (e.track.kind === 'audio') {
                    document.getElementById('remote-audio').srcObject = e.streams[0];
                } else if (e.track.kind === 'video') {
                    const stage = document.getElementById('screen-stage');
                    const v = document.getElementById('screen-display');
                    v.srcObject = e.streams[0];
                    stage.style.display = 'flex';
                    e.track.onended = () => { stage.style.display = 'none'; };
                }
            };

            peer.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('signal', { targetUser: target, signal: { type: 'candidate', candidate: e.candidate } });
                }
            };

            return peer;
        }

        async function toggleCall() {
            if (currentTarget === 'global') return alert('Please select a friend from the list to call.');
            const btn = document.getElementById('call-btn');

            if (!localMicStream) {
                try {
                    localMicStream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 48000 },
                        video: false
                    });

                    const p = getPeer(currentTarget);
                    localMicStream.getTracks().forEach(t => p.addTrack(t, localMicStream));

                    const offer = await p.createOffer();
                    await p.setLocalDescription(offer);
                    socket.emit('signal', { targetUser: currentTarget, signal: { type: 'offer', sdp: offer } });

                    btn.classList.add('live');
                    btn.innerText = '📞 End Call';
                } catch (e) {
                    alert('Mic access error: ' + e.message);
                }
            } else {
                localMicStream.getTracks().forEach(t => t.stop());
                localMicStream = null;
                btn.classList.remove('live');
                btn.innerText = '📞 Call';
            }
        }

        async function toggleScreen() {
            if (currentTarget === 'global') return alert('Please select a friend from the list to share your screen with.');
            const btn = document.getElementById('screen-btn');
            const stage = document.getElementById('screen-stage');

            if (!localScreenStream) {
                try {
                    localScreenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: { min: 1280, ideal: 1920 }, height: { min: 720, ideal: 1080 }, frameRate: { min: 30, ideal: 30, max: 60 } },
                        audio: true
                    });

                    const video = document.getElementById('screen-display');
                    video.srcObject = localScreenStream;
                    stage.style.display = 'flex';

                    const p = getPeer(currentTarget);
                    localScreenStream.getTracks().forEach(t => p.addTrack(t, localScreenStream));

                    const offer = await p.createOffer();
                    await p.setLocalDescription(offer);
                    socket.emit('signal', { targetUser: currentTarget, signal: { type: 'offer', sdp: offer } });

                    localScreenStream.getVideoTracks()[0].onended = () => {
                        localScreenStream = null;
                        stage.style.display = 'none';
                        btn.classList.remove('live');
                        btn.innerText = '🖥️ Share (720p 30+)';
                    };

                    btn.classList.add('live');
                    btn.innerText = '🖥️ Stop Share';
                } catch (e) {
                    console.log('Screen cancelled:', e);
                }
            } else {
                localScreenStream.getTracks().forEach(t => t.stop());
                localScreenStream = null;
                stage.style.display = 'none';
                btn.classList.remove('live');
                btn.innerText = '🖥️ Share (720p 30+)';
            }
        }

        socket.on('signal', async ({ sender, signal }) => {
            const p = getPeer(sender);
            if (signal.type === 'offer') {
                await p.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                const answer = await p.createAnswer();
                await p.setLocalDescription(answer);
                socket.emit('signal', { targetUser: sender, signal: { type: 'answer', sdp: answer } });
            } else if (signal.type === 'answer') {
                await p.setRemoteDescription(new RTCSessionDescription(signal.sdp));
            } else if (signal.type === 'candidate') {
                await p.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
        });
    </script>
</body>
</html>
