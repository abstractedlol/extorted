<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>extorted</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
        body { background: #07070a; color: #d6d6dc; height: 100vh; display: flex; overflow: hidden; }

        /* Auth Overlay */
        #auth-modal { position: fixed; inset: 0; background: rgba(5, 5, 7, 0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-card { background: #0f0f15; border: 1px solid #1f1f2e; padding: 30px; border-radius: 10px; width: 340px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 20px rgba(0,255,136,0.05); }
        .auth-card h2 { color: #00ff88; text-transform: uppercase; letter-spacing: 2px; font-size: 20px; text-align: center; }
        .auth-card input { background: #09090d; border: 1px solid #232334; color: #fff; padding: 12px; border-radius: 6px; outline: none; }
        .auth-card input:focus { border-color: #00ff88; }
        .btn-group { display: flex; gap: 10px; }
        .auth-card button { flex: 1; padding: 12px; background: #151520; border: 1px solid #00ff88; color: #00ff88; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .auth-card button:hover { background: #00ff881a; }
        #auth-msg { font-size: 12px; color: #ff4757; text-align: center; }

        /* App Layout */
        #app { display: none; width: 100vw; height: 100vh; flex-direction: row; }

        /* Sidebar: Friends */
        #sidebar { width: 260px; background: #0a0a0f; border-right: 1px solid #161622; display: flex; flex-direction: column; }
        .brand { padding: 18px; font-weight: 900; letter-spacing: 2px; color: #00ff88; font-size: 18px; border-bottom: 1px solid #161622; }
        .add-friend-box { padding: 12px; border-bottom: 1px solid #161622; display: flex; gap: 8px; }
        .add-friend-box input { flex: 1; background: #060609; border: 1px solid #1f1f2e; color: #fff; padding: 8px; border-radius: 4px; outline: none; font-size: 12px; }
        .add-friend-box button { background: #00ff8815; border: 1px solid #00ff88; color: #00ff88; padding: 0 10px; border-radius: 4px; cursor: pointer; }
        #friends-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .friend-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 6px; background: #0f0f16; border: 1px solid transparent; font-size: 13px; }
        .friend-row:hover { border-color: #262638; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
        .offline { background: #444; }
        .call-user-btn { background: transparent; border: 1px solid #00ff88; color: #00ff88; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }

        /* Center: Stream Screen */
        #center { flex: 2; display: flex; flex-direction: column; background: #050508; border-right: 1px solid #161622; position: relative; }
        #topbar { padding: 14px 18px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #161622; }
        .action-btn { background: #11111a; border: 1px solid #262638; color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .action-btn:hover { border-color: #00ff88; color: #00ff88; }
        .active-stream-btn { border-color: #00ff88 !important; color: #00ff88 !important; background: #00ff881a !important; }
        #stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 10px; }
        video { width: 100%; height: 100%; max-height: 100%; border-radius: 8px; background: #000; object-fit: contain; }
        #no-video { position: absolute; color: #333; font-size: 14px; letter-spacing: 1px; pointer-events: none; }

        /* Right: Chat */
        #chat { width: 340px; display: flex; flex-direction: column; background: #09090e; }
        #chat-header { padding: 16px; font-weight: bold; font-size: 13px; border-bottom: 1px solid #161622; color: #888; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble { background: #11111a; border: 1px solid #1b1b28; padding: 8px 12px; border-radius: 6px; font-size: 13px; max-width: 90%; }
        .chat-bubble b { color: #00ff88; margin-right: 6px; }
        .chat-bubble span { font-size: 10px; color: #555; margin-left: 6px; }
        #chat-input-bar { padding: 12px; border-top: 1px solid #161622; display: flex; gap: 8px; }
        #chat-input { flex: 1; background: #050508; border: 1px solid #222233; color: #fff; padding: 10px; border-radius: 6px; outline: none; font-size: 13px; }
        #chat-input:focus { border-color: #00ff88; }
        #send-btn { background: #00ff88; border: none; color: #000; font-weight: bold; padding: 0 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Auth Window -->
    <div id="auth-modal">
        <div class="auth-card">
            <h2>extorted</h2>
            <input id="auth-user" placeholder="Username" autocomplete="off">
            <input id="auth-pass" type="password" placeholder="Password">
            <div class="btn-group">
                <button onclick="auth('login')">Login</button>
                <button onclick="auth('register')">Register</button>
            </div>
            <div id="auth-msg"></div>
        </div>
    </div>

    <!-- Main Workspace -->
    <div id="app">
        <!-- Friends Panel -->
        <div id="sidebar">
            <div class="brand">extorted</div>
            <div class="add-friend-box">
                <input id="add-friend-input" placeholder="Add username...">
                <button onclick="addFriend()">+</button>
            </div>
            <div id="friends-list"></div>
        </div>

        <!-- Video & Stream Area -->
        <div id="center">
            <div id="topbar">
                <button id="voice-btn" class="action-btn" onclick="toggleVoice()">Mic Off</button>
                <button id="screen-btn" class="action-btn" onclick="toggleScreen()">Share Screen (720p 30+)</button>
            </div>
            <div id="stage">
                <span id="no-video">No screen active</span>
                <video id="screen-display" autoplay playsinline></video>
            </div>
        </div>

        <!-- Group Chat -->
        <div id="chat">
            <div id="chat-header">Global Hub</div>
            <div id="chat-messages"></div>
            <div id="chat-input-bar">
                <input id="chat-input" placeholder="Say something..." onkeydown="if(event.key==='Enter') sendChat()">
                <button id="send-btn" onclick="sendChat()">></button>
            </div>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = null;
        let activeCallFriend = null;
        let peer = null;

        let localMicStream = null;
        let localScreenStream = null;

        const iceConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // Authentication
        function auth(mode) {
            const username = document.getElementById('auth-user').value;
            const password = document.getElementById('auth-pass').value;
            if (!username || !password) return showAuthErr('Fill all fields.');
            
            socket.emit(`auth-${mode}`, { username, password });
        }

        function showAuthErr(msg) {
            document.getElementById('auth-msg').innerText = msg;
        }

        socket.on('auth-result', (res) => {
            showAuthErr(res.msg);
        });

        socket.on('login-success', (data) => {
            myUsername = data.username;
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            data.friends.forEach(renderFriend);
        });

        // Friend List
        function addFriend() {
            const input = document.getElementById('add-friend-input');
            if (input.value.trim()) {
                socket.emit('add-friend', input.value.trim());
                input.value = '';
            }
        }

        socket.on('friend-error', (err) => alert(err));

        socket.on('friend-added', renderFriend);

        socket.on('friend-status', ({ username, online }) => {
            const dot = document.getElementById(`status-${username}`);
            if (dot) dot.className = `status-dot ${online ? 'online' : 'offline'}`;
        });

        function renderFriend(friend) {
            if (document.getElementById(`friend-${friend.username}`)) return;
            const list = document.getElementById('friends-list');
            const row = document.createElement('div');
            row.className = 'friend-row';
            row.id = `friend-${friend.username}`;
            row.innerHTML = `
                <div>
                    <span id="status-${friend.username}" class="status-dot ${friend.online ? 'online' : 'offline'}"></span>
                    <span>${friend.username}</span>
                </div>
                <button class="call-user-btn" onclick="callFriend('${friend.username}')">Call</button>
            `;
            list.appendChild(row);
        }

        // Chat
        function sendChat() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            socket.emit('send-chat', { text: input.value });
            input.value = '';
        }

        socket.on('chat-message', (data) => {
            const container = document.getElementById('chat-messages');
            const b = document.createElement('div');
            b.className = 'chat-bubble';
            b.innerHTML = `<b>${data.sender}</b>${data.text}<span>${data.time}</span>`;
            container.appendChild(b);
            container.scrollTop = container.scrollHeight;
        });

        // WebRTC Connection Setup
        function setupPeer(targetUser) {
            if (peer) return peer;
            peer = new RTCPeerConnection(iceConfig);

            peer.ontrack = (e) => {
                if (e.track.kind === 'audio') {
                    document.getElementById('remote-audio').srcObject = e.streams[0];
                } else if (e.track.kind === 'video') {
                    const v = document.getElementById('screen-display');
                    v.srcObject = e.streams[0];
                    document.getElementById('no-video').style.display = 'none';
                    e.track.onended = () => {
                        document.getElementById('no-video').style.display = 'block';
                    };
                }
            };

            peer.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('signal', { targetUser, signal: { type: 'candidate', candidate: e.candidate } });
                }
            };

            return peer;
        }

        async function callFriend(target) {
            activeCallFriend = target;
            const p = setupPeer(target);
            await toggleVoice();
            const offer = await p.createOffer();
            await p.setLocalDescription(offer);
            socket.emit('signal', { targetUser: target, signal: { type: 'offer', sdp: offer } });
        }

        // Voice Controls (High Audio Fidelity)
        async function toggleVoice() {
            const btn = document.getElementById('voice-btn');
            if (!localMicStream) {
                try {
                    localMicStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            sampleRate: 48000
                        },
                        video: false
                    });
                    if (peer) {
                        localMicStream.getTracks().forEach(t => peer.addTrack(t, localMicStream));
                    }
                    btn.innerText = 'Mic Active';
                    btn.classList.add('active-stream-btn');
                } catch (e) {
                    alert('Mic access error: ' + e.message);
                }
            } else {
                localMicStream.getTracks().forEach(t => t.stop());
                localMicStream = null;
                btn.innerText = 'Mic Off';
                btn.classList.remove('active-stream-btn');
            }
        }

        // Screen Share (Locked 720p 30+ FPS + Audio Capture)
        async function toggleScreen() {
            const btn = document.getElementById('screen-btn');
            if (!localScreenStream) {
                try {
                    localScreenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: {
                            width: { min: 1280, ideal: 1920 },
                            height: { min: 720, ideal: 1080 },
                            frameRate: { min: 30, ideal: 30, max: 60 }
                        },
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });

                    const video = document.getElementById('screen-display');
                    video.srcObject = localScreenStream;
                    document.getElementById('no-video').style.display = 'none';

                    if (peer) {
                        localScreenStream.getTracks().forEach(t => peer.addTrack(t, localScreenStream));
                    }

                    localScreenStream.getVideoTracks()[0].onended = () => {
                        localScreenStream = null;
                        document.getElementById('no-video').style.display = 'block';
                        btn.innerText = 'Share Screen (720p 30+)';
                        btn.classList.remove('active-stream-btn');
                    };

                    btn.innerText = 'Stop Sharing';
                    btn.classList.add('active-stream-btn');
                } catch (e) {
                    console.log('Cancelled screen share:', e);
                }
            } else {
                localScreenStream.getTracks().forEach(t => t.stop());
                localScreenStream = null;
                document.getElementById('no-video').style.display = 'block';
                btn.innerText = 'Share Screen (720p 30+)';
                btn.classList.remove('active-stream-btn');
            }
        }

        // Signaling handlers
        socket.on('signal', async ({ sender, signal }) => {
            activeCallFriend = sender;
            const p = setupPeer(sender);

            if (signal.type === 'offer') {
                await p.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                const answer = await p.createAnswer();
                await p.setLocalDescription(answer);
                socket.emit('signal', { targetUser: sender, signal: { type: 'answer', sdp: answer } });
            } else if (signal.type === 'answer') {
                await p.setRemoteDescription(new RTCSessionDescription(signal.sdp));
            } else if (signal.type === 'candidate') {
                await p.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
        });
    </script>
</body>
</html>
